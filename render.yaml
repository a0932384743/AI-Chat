services:
  # LiteLLM proxy — OpenAI-compatible gateway in front of your LLM provider(s).
  # Built from docker/litellm/Dockerfile, which bakes in litellm.config.yaml
  # (chat + embedding models — the knowledge base feature needs both).
  - type: web
    name: litellm-proxy
    runtime: docker
    dockerfilePath: ./docker/litellm/Dockerfile
    dockerContext: .
    plan: starter
    region: oregon
    healthCheckPath: /health/liveliness
    envVars:
      - key: PORT
        value: "4000"
      - key: LITELLM_MASTER_KEY
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false

  # Next.js chat window, talking to litellm-proxy over Render's private network.
  - type: web
    name: ai-chat-web
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      # Internal hostname works because both services are in this same
      # blueprint/region — "litellm-proxy" is the service name above and
      # 4000 is the port it listens on.
      - key: LITELLM_BASE_URL
        value: http://litellm-proxy:4000
      - key: LITELLM_API_KEY
        fromService:
          type: web
          name: litellm-proxy
          envVarKey: LITELLM_MASTER_KEY
      - key: LITELLM_MODEL
        value: gpt-4o-mini
      - key: LITELLM_EMBEDDING_MODEL
        value: text-embedding-3-small
      # Knowledge base storage is a JSON file on local disk. It survives
      # restarts only if you attach a Render Disk mounted at this path —
      # otherwise it resets on every deploy.
      - key: KB_DATA_DIR
        value: /var/data/kb
